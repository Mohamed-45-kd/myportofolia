<!-- @dsCard group="Colors" viewport="700x160" name="Light theme" subtitle="data-theme=\"light\" flips surfaces and text; blues deepen to #0066FF" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-base);font-family:var(--font-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px}.chip{width:96px;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-primary);letter-spacing:.04em}.h{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);letter-spacing:.08em}</style></head><body><div data-theme="light" style="background:var(--bg-base);border-radius:var(--radius-lg);padding:16px;display:flex;gap:12px;align-items:center">
<div class="sw"><div class="chip" style="background:var(--surface-card)"></div><span class="n" style="color:var(--text-primary)">card</span><span class="h">#FFFFFF</span></div>
<div class="sw"><div class="chip" style="background:var(--bg-subtle)"></div><span class="n" style="color:var(--text-primary)">subtle</span><span class="h">#F1F5F9</span></div>
<div class="sw"><div class="chip" style="background:var(--brand-deep)"></div><span class="n" style="color:var(--text-primary)">link</span><span class="h">#0066FF</span></div>
<div style="flex:1;padding-left:8px">
<div style="font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.03em;color:var(--text-primary)">Same structure, inverted values</div>
<div style="font-size:13px;color:var(--text-muted);margin-top:4px">Only semantic aliases change. Never hardcode a hex in a component.</div>
</div></div></body></html>
