<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-base);font-family:var(--font-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px}.chip{width:96px;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-primary);letter-spacing:.04em}.h{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);letter-spacing:.08em}</style></head><body><div class="g"><div class="sw"><div class="chip" style="background:#0A84FF"></div><span class="n">primary</span><span class="h">#0A84FF</span></div><div class="sw"><div class="chip" style="background:#00C2FF"></div><span class="n">accent</span><span class="h">#00C2FF</span></div><div class="sw"><div class="chip" style="background:#0066FF"></div><span class="n">deep</span><span class="h">#0066FF</span></div><div class="sw"><div class="chip" style="background:#339EFF"></div><span class="n">blue-400</span><span class="h">#339EFF</span></div><div class="sw"><div class="chip" style="background:#0049CC"></div><span class="n">blue-700</span><span class="h">#0049CC</span></div><div class="sw"><div class="chip" style="background:#009BCC"></div><span class="n">cyan-600</span><span class="h">#009BCC</span></div></div></body></html>
