<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-base);font-family:var(--font-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px}.chip{width:96px;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-primary);letter-spacing:.04em}.h{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);letter-spacing:.08em}</style></head><body><div class="g"><div class="sw"><div class="chip" style="background:#05070B"></div><span class="n">bg-base</span><span class="h">#05070B</span></div><div class="sw"><div class="chip" style="background:#0B111A"></div><span class="n">surface</span><span class="h">#0B111A</span></div><div class="sw"><div class="chip" style="background:#111A27"></div><span class="n">card</span><span class="h">#111A27</span></div><div class="sw"><div class="chip" style="background:#16202F"></div><span class="n">hover</span><span class="h">#16202F</span></div><div class="sw"><div class="chip" style="background:#1E293B"></div><span class="n">border</span><span class="h">#1E293B</span></div><div class="sw"><div class="chip" style="background:#334155"></div><span class="n">border-strong</span><span class="h">#334155</span></div></div></body></html>
