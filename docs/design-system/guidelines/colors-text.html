<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-base);font-family:var(--font-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px}.chip{width:96px;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-primary);letter-spacing:.04em}.h{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);letter-spacing:.08em}</style></head><body><div style="display:grid;gap:9px">
