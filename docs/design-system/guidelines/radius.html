<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-base);font-family:var(--font-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px}.chip{width:96px;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-primary);letter-spacing:.04em}.h{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);letter-spacing:.08em}</style></head><body><div class="g"><div class="sw"><div style="width:80px;height:56px;border-radius:4px;background:var(--surface-card);border:1px solid var(--border-strong);box-shadow:var(--inset-hairline)"></div><span class="n">xs</span><span class="h">4px</span></div><div class="sw"><div style="width:80px;height:56px;border-radius:6px;background:var(--surface-card);border:1px solid var(--border-strong);box-shadow:var(--inset-hairline)"></div><span class="n">sm</span><span class="h">6px</span></div><div class="sw"><div style="width:80px;height:56px;border-radius:10px;background:var(--surface-card);border:1px solid var(--border-strong);box-shadow:var(--inset-hairline)"></div><span class="n">md</span><span class="h">10px</span></div><div class="sw"><div style="width:80px;height:56px;border-radius:14px;background:var(--surface-card);border:1px solid var(--border-strong);box-shadow:var(--inset-hairline)"></div><span class="n">lg</span><span class="h">14px</span></div><div class="sw"><div style="width:80px;height:56px;border-radius:20px;background:var(--surface-card);border:1px solid var(--border-strong);box-shadow:var(--inset-hairline)"></div><span class="n">xl</span><span class="h">20px</span></div><div class="sw"><div style="width:80px;height:56px;border-radius:28px;background:var(--surface-card);border:1px solid var(--border-strong);box-shadow:var(--inset-hairline)"></div><span class="n">2xl</span><span class="h">28px</span></div><div class="sw"><div style="width:80px;height:56px;border-radius:999px;background:var(--surface-card);border:1px solid var(--border-strong)"></div><span class="n">pill</span><span class="h">999px</span></div></div></body></html>
