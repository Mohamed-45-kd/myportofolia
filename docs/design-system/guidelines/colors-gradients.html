<!-- @dsCard group="Colors" viewport="700x150" name="Gradients & glow" subtitle="One brand gradient, one text gradient, one hero glow" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-base);font-family:var(--font-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px}.chip{width:96px;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-primary);letter-spacing:.04em}.h{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);letter-spacing:.08em}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
<div class="sw"><div style="height:58px;border-radius:var(--radius-md);background:var(--gradient-brand);box-shadow:var(--glow-brand)"></div><span class="n">--gradient-brand</span><span class="h">135° deep → primary → accent</span></div>
<div class="sw"><div style="height:58px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);display:grid;place-items:center"><span style="font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.03em;background:var(--gradient-text);-webkit-background-clip:text;background-clip:text;color:transparent">Digitalize</span></div><span class="n">--gradient-text</span><span class="h">headline accent word only</span></div>
<div class="sw"><div style="height:58px;border-radius:var(--radius-md);background:#05070B;box-shadow:var(--glow-accent);border:1px solid var(--border-brand)"></div><span class="n">--glow-accent</span><span class="h">focus · active nav · featured card</span></div>
</div></body></html>
