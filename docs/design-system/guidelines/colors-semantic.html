<!-- @dsCard group="Colors" viewport="700x140" name="Semantic status" subtitle="Success, warning, danger, info + their 12% surfaces" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-base);font-family:var(--font-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px}.chip{width:96px;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-primary);letter-spacing:.04em}.h{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);letter-spacing:.08em}</style></head><body><div class="g"><div class="sw"><div class="chip" style="background:#22D39A"></div><span class="n">success</span><span class="h">#22D39A</span></div><div class="sw"><div class="chip" style="background:#FFB020"></div><span class="n">warning</span><span class="h">#FFB020</span></div><div class="sw"><div class="chip" style="background:#FF4D5E"></div><span class="n">danger</span><span class="h">#FF4D5E</span></div><div class="sw"><div class="chip" style="background:#00C2FF"></div><span class="n">info</span><span class="h">#00C2FF</span></div></div>
<div class="g" style="margin-top:10px">
<span style="padding:6px 12px;border-radius:999px;background:var(--success-surface);border:1px solid rgba(34,211,154,.3);color:var(--success-500);font-size:12px;font-weight:600">Live</span>
<span style="padding:6px 12px;border-radius:999px;background:var(--warning-surface);border:1px solid rgba(255,176,32,.3);color:var(--warning-500);font-size:12px;font-weight:600">Draft</span>
<span style="padding:6px 12px;border-radius:999px;background:var(--danger-surface);border:1px solid rgba(255,77,94,.3);color:var(--danger-500);font-size:12px;font-weight:600">Failed</span>
<span style="padding:6px 12px;border-radius:999px;background:var(--info-surface);border:1px solid rgba(0,194,255,.3);color:var(--info-500);font-size:12px;font-weight:600">Info</span></div></body></html>
