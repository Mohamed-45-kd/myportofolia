<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-base);font-family:var(--font-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px}.chip{width:96px;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);box-shadow:var(--inset-hairline)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-primary);letter-spacing:.04em}.h{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);letter-spacing:.08em}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="height:120px;border-radius:var(--radius-lg);border:1px solid var(--border-subtle);background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:28px 28px;display:grid;place-items:end start;padding:10px"><span class="h">GRID 28px · rgba(30,41,59,.55)</span></div>
<div style="height:120px;border-radius:var(--radius-lg);border:1px solid var(--border-subtle);background:var(--gradient-hero-glow),#05070B;display:grid;place-items:end start;padding:10px"><span class="h">HERO GLOW · radial 60% at 50% 0%</span></div>
</div></body></html>
